
# Append this to your esphome yaml.
##############################################################################
# CANipulator MitM — Growatt TL10000 HU US B ↔ Ruixu Lithi2-16 (or similar)
# Uses a dual-canbus device that sits between the inverter and battery
# to modify requested charge rate to control charge speed and max SOC
# 
# CANipulator GPIO:
#
# CAN0 (TWAI0) GPIO16/17 — Growatt inverter
# CAN1 (TWAI1) GPIO18/19 — Ruixu battery (Growatt/Pylontech protocol)
#
# GPIO 0-3 are transceiver STANDBY/SHUTDOWN control lines; all driven LOW.
#   GPIO0 = CAN0 STANDBY   GPIO1 = CAN1 STANDBY
#   GPIO2 = CAN1 SHUTDOWN  GPIO3 = CAN0 SHUTDOWN
#
# Relay design
# ────────────
# All frames pass through in both directions in real time.
# The ONLY modification: 0x351 from battery (charge/discharge limits) has its
# max-charge-current field (bytes 2-3, uint16 LE, 0.1 A/bit) optionally
# clamped down when Home Assistant has provided a fresh limit.  The frame is
# NEVER modified to a value higher than what the battery requests, and is
# passed unchanged when:
#   • HA has not sent a limit, or
#   • HA has been disconnected
#
# NOTE on dual-TWAI support
# ─────────────────────────
# ESPHome allocates TWAI0 to the first esp32_can entry and TWAI1 to the second.
# This is automatic on ESP32-C6.  Verify with ESPHome 2026.5+ that the
# esp32_can component exposes a `controller` key if you ever need to override
# the assignment order.
##############################################################################

substitutions:
  device_name: canipulator
  friendly_name: "CANipulator MitM"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  on_boot:
    # Drive transceiver control pins LOW before CAN controllers start (priority
    # 800 runs before most component initialisation at 600).
    priority: 800
    then:
      - output.turn_off: pin_can0_standby
      - output.turn_off: pin_can0_shutdown
      - output.turn_off: pin_can1_standby
      - output.turn_off: pin_can1_shutdown

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

# ── Logging ───────────────────────────────────────────────────────────────────
logger:
  level: INFO
  logs:
    canbus: WARN     # suppress per-frame canbus component noise
    mitm: INFO       # our own tag — periodic stats and limit changes


# ── Home Assistant API ────────────────────────────────────────────────────────
api:
  encryption:
    key: !secret api_key
  # Do not reboot if HA is unavailable — CAN relaying must continue regardless.
  reboot_timeout: 0s
  on_client_connected:
    then:
      - logger.log:
          level: INFO
          tag: mitm
          format: "HA client connected (informational — limit gated by automation heartbeat)"
  on_client_disconnected:
    then:
      - logger.log:
          level: WARN
          tag: mitm
          format: "HA client disconnected (informational — limit expires after 10 min without update)"

# ── GPIO outputs: transceiver STANDBY / SHUTDOWN ─────────────────────────────
# All four pins are simply held LOW for normal transceiver operation.
output:
  - platform: gpio
    id: pin_can0_standby    # GPIO0 → CAN0 STANDBY
    pin: GPIO0
  - platform: gpio
    id: pin_can1_standby    # GPIO1 → CAN1 STANDBY
    pin: GPIO1
  - platform: gpio
    id: pin_can1_shutdown   # GPIO2 → CAN1 SHUTDOWN
    pin: GPIO2
  - platform: gpio
    id: pin_can0_shutdown   # GPIO3 → CAN0 SHUTDOWN
    pin: GPIO3

# ── Globals ───────────────────────────────────────────────────────────────────
globals:
  # HA-provided charge-current cap (A).  -1.0 = not set / uncapped.
  # restore_value: false — boots uncapped every time; the HA automation
  # re-applies the limit within its first scheduled run (≤ 5 minutes).
  - id: charge_limit_amps
    type: float
    restore_value: false
    initial_value: "-1.0"

  # millis() timestamp of the last set_action call.  Used as a liveness
  # heartbeat: the automation runs every 5 minutes, so a 10-minute timeout
  # gives 2× headroom against brief HA restarts.  If HA goes away longer
  # than LIMIT_STALE_MS the cap is suspended until HA sends a fresh value.
  - id: charge_limit_ts
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Per-bus watchdog timestamps.  Tracked separately so a single-bus failure
  # (e.g. CAN0 bus-off while CAN1 is still active) is detected.
  # Both start at 0; the watchdog skips a bus until its first frame arrives.
  - id: last_rx_batt_ms    # last frame received FROM battery (CAN1)
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_rx_inv_ms     # last frame received FROM inverter (CAN0)
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Last-seen 0x351 state — written by the frame handler, read by the interval log.
  # Using globals avoids any logging in the hot path.
  - id: last_batt_ask_amps     # battery's most recent requested max charge current
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: last_cap_state         # 0=no limit set, 1=capped, 2=limit>=ask (passing), 3=stale (HA away)
    type: int
    restore_value: false
    initial_value: "0"

  # Rolling frame counters — reset every stats interval.
  - id: cnt_batt_to_inv
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: cnt_inv_to_batt
    type: uint32_t
    restore_value: false
    initial_value: "0"

# ── CAN buses ─────────────────────────────────────────────────────────────────
canbus:

  # ── CAN0 / TWAI0: Growatt inverter ─────────────────────────────────────────
  - platform: esp32_can
    id: can_inverter
    rx_pin: GPIO16
    tx_pin: GPIO17
    bit_rate: 500kbps
    can_id: 0x064              # node TX id (required); arbitrary, not used for filtering
    on_frame:
      # Catch-all for standard frames (mask 0x000 matches every ID).
      # Extended-ID frames from the inverter are not expected in the
      # Growatt/Pylontech protocol; add a second entry with
      # use_extended_id: true if your inverter uses them.
      - can_id: 0x000
        can_id_mask: 0x000
        use_extended_id: false
        then:
          - lambda: |-
              id(last_rx_inv_ms) = millis();
              id(can_battery).send_data(can_id, false, x);
              id(cnt_inv_to_batt)++;

  # ── CAN1 / TWAI1: Ruixu battery (Growatt/Pylontech protocol) ───────────────
  - platform: esp32_can
    id: can_battery
    rx_pin: GPIO18
    tx_pin: GPIO19
    bit_rate: 500kbps
    can_id: 0x0C8              # node TX id (required); arbitrary, not used for filtering
    on_frame:

      # ── 0x351: Charge/discharge voltage & current limits ──────────────────
      # Parse battery's requested max charge current, optionally clamp it, then
      # forward to inverter.  All other bytes pass unchanged.
      #
      # Frame layout (Pylontech/Growatt):
      #   Bytes 0-1  Charge voltage limit       uint16 LE  0.1 V/bit
      #   Bytes 2-3  Max charge current          uint16 LE  0.1 A/bit  ← we cap this
      #   Bytes 4-5  Max discharge current       uint16 LE  0.1 A/bit
      #   Bytes 6-7  Min discharge voltage       uint16 LE  0.1 V/bit
      - can_id: 0x351
        can_id_mask: 0x7FF
        use_extended_id: false
        then:
          - lambda: |-
              if (x.size() < 8) {
                id(can_inverter).send_data(can_id, false, x);
                id(cnt_batt_to_inv)++;
                return;
              }

              uint16_t batt_cc_raw  = (uint16_t)x[2] | ((uint16_t)x[3] << 8);
              float    batt_cc_amps = batt_cc_raw * 0.1f;

              id(sensor_batt_charge_max).publish_state(batt_cc_amps);

              // Apply HA cap only while HA is connected and cap < battery ask.
              // Cap applies only when a limit has been set AND the timestamp is
              // fresh (< 10 min).  The HA automation refreshes the timestamp every
              // 5 minutes, so expiry means HA has been unreachable for ~10 minutes.
              const uint32_t LIMIT_STALE_MS = 600000UL;  // 10 minutes
              std::vector<uint8_t> fwd(x);
              float cap = id(charge_limit_amps);
              bool fresh = (id(charge_limit_ts) != 0) &&
                           ((millis() - id(charge_limit_ts)) < LIMIT_STALE_MS);
              bool limit_active = false;

              if (cap >= 0.0f && fresh && cap < batt_cc_amps) {
                uint16_t cap_raw = (uint16_t)(cap * 10.0f);
                fwd[2] = (uint8_t)(cap_raw & 0xFF);
                fwd[3] = (uint8_t)(cap_raw >> 8);
                limit_active = true;
              }

              // Record state for the interval logger — no logging in the frame path.
              id(last_batt_ask_amps) = batt_cc_amps;
              if (limit_active)          id(last_cap_state) = 1;  // capped
              else if (!fresh && cap >= 0.0f) id(last_cap_state) = 3;  // stale — HA away
              else if (cap >= 0.0f)      id(last_cap_state) = 2;  // limit >= battery ask
              else                       id(last_cap_state) = 0;  // no limit set

              id(can_inverter).send_data(can_id, false, fwd);
              id(cnt_batt_to_inv)++;

      # ── 0x355: SOC / SOH ──────────────────────────────────────────────────
      # Bytes 0-1  SOC  uint16 LE  %
      # Bytes 2-3  SOH  uint16 LE  %
      - can_id: 0x355
        can_id_mask: 0x7FF
        use_extended_id: false
        then:
          - lambda: |-
              if (x.size() >= 4) {
                uint16_t soc = (uint16_t)x[0] | ((uint16_t)x[1] << 8);
                uint16_t soh = (uint16_t)x[2] | ((uint16_t)x[3] << 8);
                id(sensor_batt_soc).publish_state((float)soc);
                id(sensor_batt_soh).publish_state((float)soh);
              }
              id(can_inverter).send_data(can_id, false, x);
              id(cnt_batt_to_inv)++;

      # ── 0x356: Pack voltage / current / temperature ───────────────────────
      # Bytes 0-1  Voltage      int16 LE  0.01 V/bit
      # Bytes 2-3  Current      int16 LE  0.1  A/bit  (positive = charging)
      # Bytes 4-5  Temperature  int16 LE  0.1  °C/bit
      - can_id: 0x356
        can_id_mask: 0x7FF
        use_extended_id: false
        then:
          - lambda: |-
              if (x.size() >= 6) {
                int16_t v = (int16_t)((uint16_t)x[0] | ((uint16_t)x[1] << 8));
                int16_t i = (int16_t)((uint16_t)x[2] | ((uint16_t)x[3] << 8));
                int16_t t = (int16_t)((uint16_t)x[4] | ((uint16_t)x[5] << 8));
                id(sensor_batt_voltage).publish_state(v * 0.01f);
                id(sensor_batt_current).publish_state(i * 0.1f);
                id(sensor_batt_temp).publish_state(t * 0.1f);
              }
              id(can_inverter).send_data(can_id, false, x);
              id(cnt_batt_to_inv)++;

      # ── Catch-all: relay every other battery frame unmodified ──────────────
      # Because ESPHome fires ALL matching on_frame handlers, the specific
      # handlers above will also fire for 0x351/355/356.  This catch-all
      # guards against double-relay by skipping those IDs explicitly.
      - can_id: 0x000
        can_id_mask: 0x000
        use_extended_id: false
        then:
          - lambda: |-
              id(last_rx_batt_ms) = millis();  // stamp before the skip guard
              if (can_id == 0x351 || can_id == 0x355 || can_id == 0x356) return;
              id(can_inverter).send_data(can_id, false, x);
              id(cnt_batt_to_inv)++;

# ── Sensors exposed to Home Assistant ─────────────────────────────────────────
sensor:
  - platform: template
    name: "Battery SOC"
    id: sensor_batt_soc
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement

  - platform: template
    name: "Battery SOH"
    id: sensor_batt_soh
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement

  - platform: template
    name: "Battery Voltage"
    id: sensor_batt_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement

  - platform: template
    name: "Battery Current"
    id: sensor_batt_current
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement

  - platform: template
    name: "Battery Temperature"
    id: sensor_batt_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  - platform: template
    name: "Battery Charge Current Max (Requested)"
    id: sensor_batt_charge_max
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement

# ── Number: HA-set charge-current cap ─────────────────────────────────────────
# Set to a value lower than the battery's requested max to throttle charging.
# Set to 200 (or any value ≥ the battery's max) to effectively disable the cap.
# The cap is automatically cleared when HA disconnects or the value goes stale.
number:
  - platform: template
    name: "Charge Rate Limit"
    id: charge_limit_number
    min_value: 0
    max_value: 200
    step: 0.5
    unit_of_measurement: "A"
    optimistic: true
    restore_value: true   # remembers last UI value across reboots (display only)
    set_action:
      - globals.set:
          id: charge_limit_amps
          value: !lambda "return x;"
      - globals.set:
          id: charge_limit_ts
          value: !lambda "return (uint32_t) millis();"
      - logger.log:
          level: INFO
          tag: mitm
          format: "Charge-rate limit set to %.1f A"
          args: ["x"]

# ── Periodic traffic stats ─────────────────────────────────────────────────────
# Logs counts every 10 s so you can confirm both directions are active without
# flooding the log with a line per frame.
interval:
  - interval: 10s
    then:
      - lambda: |-
          const char* cap_str;
          switch (id(last_cap_state)) {
            case 1:  cap_str = "CAPPED";               break;
            case 2:  cap_str = "passing (limit>=ask)"; break;
            case 3:  cap_str = "passing (HA timeout)"; break;
            default: cap_str = "passing (no limit)";   break;
          }
          float lim = id(charge_limit_amps);
          ESP_LOGI("mitm",
            "Traffic (last 10 s): batt→inv %u, inv→batt %u | "
            "batt_ask=%.1fA limit=%.1fA %s",
            id(cnt_batt_to_inv), id(cnt_inv_to_batt),
            id(last_batt_ask_amps), lim, cap_str);
          id(cnt_batt_to_inv) = 0;
          id(cnt_inv_to_batt) = 0;

  # ── Per-bus CAN watchdog ──────────────────────────────────────────────────
  # Monitors each bus independently.  A single-bus failure (e.g. CAN0 bus-off
  # while CAN1 is still active) would not trip a combined watchdog, so the
  # timestamps are tracked and checked separately.
  #
  # Battery (CAN1): broadcasts ~2 Hz; 30 s silence = definite failure.
  # Inverter (CAN0): sends ~1 Hz when active; 30 s silence = definite failure.
  # Both skip the check until the first frame arrives on that bus (== 0 guard)
  # so a cold-start where one side powers up slowly doesn't false-trip.
  - interval: 15s
    then:
      - lambda: |-
          uint32_t now_ms = millis();
          const uint32_t SILENCE_MS = 30000;

          bool batt_dead = (id(last_rx_batt_ms) != 0) &&
                           ((now_ms - id(last_rx_batt_ms)) > SILENCE_MS);
          bool inv_dead  = (id(last_rx_inv_ms)  != 0) &&
                           ((now_ms - id(last_rx_inv_ms))  > SILENCE_MS);

          if (batt_dead || inv_dead) {
            ESP_LOGE("mitm",
              "CAN watchdog: %s%s silent >%u ms — TWAI bus-off likely. Rebooting.",
              batt_dead ? "battery " : "",
              inv_dead  ? "inverter" : "",
              SILENCE_MS);
            delay(200);
            esp_restart();
          }

