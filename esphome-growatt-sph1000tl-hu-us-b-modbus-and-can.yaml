# ============================================
# INVERTER TEMPERATURES
# ============================================

  # Inverter Temperature (Address 93)
  - platform: modbus_controller
    modbus_controller_id: growatt_sph
    address: 93
    name: "Inverter Temperature"
    register_type: read
    value_type: S_WORD  # Changed from U_WORD to support negative temperatures
    response_size: 2  # Explicit response size for reliability
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    skip_updates: ${skip_count_for_temperature}
    filters:
      - multiply: 0.1
      - clamp:
          min_value: -40
          max_value: 200
          ignore_out_of_range: true
      - median:  
          window_size: 3 # Ignore zero in 11, 0, 11 sequence
      - delta: 0.5 # tune out jitter to save storage.
          
  # IPM Temperature (Address 94)
  - platform: modbus_controller
    modbus_controller_id: growatt_sph
    address: 94
    name: "IPM Temperature"
    register_type: read
