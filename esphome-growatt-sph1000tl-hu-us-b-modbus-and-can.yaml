# ============================================
# BATTERY
# ============================================

  # Battery Voltage (Address 1013)
  - platform: modbus_controller
    modbus_controller_id: growatt_sph
    address: 1013
    name: "Battery Voltage"
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      # Reject spurious values from Modbus errors, sometimes reads >5k
      - clamp:
          min_value: 0
          max_value: 100
          ignore_out_of_range: true          

  # Battery State of Charge (Address 1014)
  - platform: modbus_controller
    modbus_controller_id: growatt_sph
    address: 1014
    name: "Battery SOC"
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    filters:
      # Reject spurious values from Modbus errors
      # Battery SOC should be 0-100%, reject anything outside this range
      - clamp:
          min_value: 0
          max_value: 100
          ignore_out_of_range: true
      - median:  
          window_size: 3 # Ignore 54%, 0%, 54% sequence for bad readings:
      - delta: 0.5 # tune out jitter to save storage.

  # Battery Discharge Power (Address 1009-1010)
  - platform: modbus_controller
    modbus_controller_id: growatt_sph
    address: 1009
    name: "Battery Discharge Power"
    id: battery_discharge_power
    register_type: read
    value_type: U_DWORD
    response_size: 4
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    filters:
      - multiply: 0.1
      # Reject spurious values from Modbus errors, somtimes reads >60 million
      - clamp:
          min_value: 0
          max_value: 20000
          ignore_out_of_range: true      

  # Battery Charge Power (Address 1011-1012)
  - platform: modbus_controller
    modbus_controller_id: growatt_sph
    address: 1011
    name: "Battery Charge Power"
    id: battery_charge_power
    register_type: read
    value_type: U_DWORD
    response_size: 4
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    filters:
      - multiply: 0.1
            # Reject spurious values from Modbus errors
      - clamp:
          min_value: 0
          max_value: 20000
          ignore_out_of_range: true    


  # Battery Current (Address 1088)
  - platform: modbus_controller
    modbus_controller_id: growatt_sph
    address: 1088
    name: "Battery Current"
    id: battery_current
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Battery Temperature (Address 1039-1040)
  # This is specific to battery "Ruixu Lithi2-16" set to Growatt Protocol and 
  #  inverter set to "04"
  # Inverter reads from battery CAN bus as unsigned, causing negative temps
  # to appear as large positive values (e.g., -34 becomes 65502)
  # Hack to convert to signed integers and enforce sane value filters.
  - platform: modbus_controller
    modbus_controller_id: growatt_sph
    address: 1039
    name: "Battery Temperature"
    register_type: read
    value_type: U_DWORD  # Read as unsigned to get raw value
    response_size: 4
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    skip_updates: ${skip_count_for_temperature}
    lambda: |-
      uint32_t raw = (uint32_t)x;
      
      // If value is in the 16-bit unsigned overflow range (65000-65535),
      // it's likely a negative temperature misinterpreted as unsigned
      if (raw >= 65000 && raw <= 65535) {
        // Convert back to signed 16-bit interpretation
        int16_t signed_val = (int16_t)(raw & 0xFFFF);
        float temp = signed_val * 0.1;
        ESP_LOGD("battery_temp", "Negative temp detected - Raw: %u, Converted: %.1f°C", raw, temp);
        return temp;
      }
      
      // Normal positive temperature
      float temp = raw * 0.1;
      
      // Validate range
      if (temp < -40.0 || temp > 200.0) {
        ESP_LOGW("battery_temp", "Out of range - Raw: %u, Temp: %.1f°C", raw, temp);
        return {};  // Return empty (Unknown)
      }
      
      return temp;
    filters:
      - median:
          window_size: 3
      - delta: 0.5

